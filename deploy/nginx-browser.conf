# Вставь этот блок внутрь существующего server { ... } твоего домена
# (рядом с остальными location), затем: nginx -t && systemctl reload nginx

location = /browser {
    return 301 /browser/;
}

location /browser/ {
    proxy_pass http://127.0.0.1:3100;   # без слэша на конце — префикс /browser сохраняется
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;             # запуск браузера/проверка прокси может занимать время
    client_max_body_size 4m;
}
